<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprar – BUCAPE-TECH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --blue:    #1a56db;
            --blue-dk: #1343b5;
            --accent:  #e63946;
            --text:    #1a1a2e;
            --muted:   #6b7280;
            --border:  #e5e7eb;
            --bg:      #f8f9fb;
            --white:   #ffffff;
            --card-r:  12px;
        }

        body { font-family: 'Roboto', sans-serif; background: var(--bg); color: var(--text); }

        /* ── TOPBAR ── */
        .topbar { background: var(--blue); color: #fff; font-size: .82rem; padding: 10px 0; }
        .topbar .wrap { max-width: 1400px; margin: auto; padding: 0 28px; display: flex; justify-content: space-between; align-items: center; }
        .topbar-logo { font-family: 'Montserrat', sans-serif; font-weight: 800; color: #fff; letter-spacing: 1px; font-size: 1.1rem; text-decoration: none; }
        .topbar-links { display: flex; gap: 24px; }
        .topbar a.social { color: rgba(255,255,255,.85); text-decoration: none; font-weight: 500; font-size: .85rem; transition: color .2s; }
        .topbar a.social:hover { color: #fff; }

        /* ── HEADER / NAVBAR ── */
        .header { background: var(--blue); position: sticky; top: 0; z-index: 100; padding: 10px 0 14px; }
        .header .wrap { max-width: 1400px; margin: auto; padding: 0 28px; }

        /* Nav pill */
        .nav-pill {
            background: var(--white);
            border-radius: 50px;
            display: flex;
            align-items: center;
            height: 54px;
            padding: 0 16px;
            gap: 0;
        }

        /* Hamburger */
        .nav-hamburger {
            background: none; border: none; cursor: pointer;
            color: var(--text); font-size: 1.1rem;
            padding: 8px 12px 8px 4px;
            display: flex; align-items: center;
            flex-shrink: 0;
        }
        .nav-hamburger:hover { color: var(--blue); }

        /* Nav links */
        .nav-links {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            list-style: none;
        }
        .nav-links a {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: .82rem;
            letter-spacing: .06em;
            color: var(--text);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 30px;
            transition: color .2s;
            white-space: nowrap;
        }
        .nav-links a:hover { color: var(--blue); }
        .nav-links a.active {
            color: var(--blue);
            position: relative;
        }
        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: -2px; left: 50%; transform: translateX(-50%);
            width: 24px; height: 3px;
            background: var(--blue);
            border-radius: 2px;
        }

        /* Nav icons */
        .nav-icons { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .nav-icon-btn {
            background: none; border: none; cursor: pointer;
            color: var(--text); font-size: 1.05rem;
            width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; transition: all .2s;
            position: relative; text-decoration: none;
        }
        .nav-icon-btn:hover { background: #eff6ff; color: var(--blue); }
        .cart-badge { position: absolute; top: -2px; right: -2px; background: #06b6d4; color: #fff; font-size: .6rem; font-weight: 700; border-radius: 50%; width: 17px; height: 17px; display: flex; align-items: center; justify-content: center; }

        /* ── BREADCRUMB ── */
        .breadcrumb { max-width: 1400px; margin: 14px auto 0; padding: 0 20px; font-size: .82rem; color: var(--muted); }
        .breadcrumb a { color: var(--blue); text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }
        .breadcrumb span { margin: 0 6px; }

        /* ── MAIN LAYOUT ── */
        .shop-layout { max-width: 1400px; margin: 18px auto 60px; padding: 0 20px; display: grid; grid-template-columns: 230px 1fr; gap: 24px; }

        /* ── SIDEBAR / FILTERS ── */
        .filters { background: var(--white); border: 1px solid var(--border); border-radius: var(--card-r); padding: 22px; align-self: start; position: sticky; top: 82px; }
        .filter-section { margin-bottom: 26px; }
        .filter-section:last-child { margin-bottom: 0; }
        .filter-title { font-family: 'Montserrat', sans-serif; font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }

        /* Category buttons */
        .cat-btn { display: block; width: 100%; text-align: left; padding: 9px 12px; border-radius: 8px; border: none; background: none; cursor: pointer; font-size: .88rem; font-family: 'Roboto', sans-serif; color: var(--text); transition: all .15s; }
        .cat-btn:hover { background: #eff6ff; color: var(--blue); }
        .cat-btn.active { background: var(--blue); color: #fff; font-weight: 600; }

        /* Price slider */
        .price-slider { width: 100%; accent-color: var(--blue); cursor: pointer; }
        .price-label { font-size: .88rem; color: var(--text); margin-top: 8px; }
        .price-label strong { color: var(--blue); }

        /* Sort select */
        .sort-select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: .88rem; font-family: 'Roboto', sans-serif; outline: none; cursor: pointer; background: var(--white); transition: border-color .2s; }
        .sort-select:focus { border-color: var(--blue); }

        /* Offers toggle */
        .offers-row { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .offers-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--blue); cursor: pointer; }
        .offers-row label { font-size: .88rem; cursor: pointer; }

        .clear-btn { display: block; width: 100%; text-align: center; padding: 7px; border: 1px solid var(--border); border-radius: 8px; background: none; cursor: pointer; font-size: .82rem; color: var(--muted); transition: all .2s; margin-top: 8px; }
        .clear-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* ── PRODUCTS AREA ── */
        .products-area {}
        .results-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .results-count { font-size: .9rem; color: var(--muted); }
        .results-count strong { color: var(--text); }
        .view-toggle { display: flex; gap: 6px; }
        .view-btn { border: 1px solid var(--border); background: none; width: 34px; height: 34px; border-radius: 6px; cursor: pointer; color: var(--muted); transition: all .15s; }
        .view-btn.active, .view-btn:hover { background: var(--blue); border-color: var(--blue); color: #fff; }

        /* ── PRODUCT GRID ── */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
        .products-grid.list-view { grid-template-columns: 1fr; }

        /* ── PRODUCT CARD ── */
        .product-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--card-r);
            overflow: hidden;
            cursor: pointer;
            transition: transform .25s, box-shadow .25s;
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(26,86,219,.12);
        }

        /* Image gallery on hover */
        .card-img-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            overflow: hidden;
            background: #f3f4f6;
        }
        .card-img-wrap img {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: opacity .35s ease, transform .4s ease;
        }
        .card-img-main { opacity: 1; transform: scale(1); z-index: 2; }
        .card-img-alt  { opacity: 0; transform: scale(1.04); z-index: 1; }

        .product-card:hover .card-img-main { opacity: 0; transform: scale(1.06); }
        .product-card:hover .card-img-alt  { opacity: 1; transform: scale(1); z-index: 3; }

        /* Dots indicator */
        .img-dots {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 5px; z-index: 10; opacity: 0;
            transition: opacity .2s;
        }
        .product-card:hover .img-dots { opacity: 1; }
        .img-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.6); }
        .img-dot.active { background: #fff; }

        /* Badges */
        .badge-sale {
            position: absolute; top: 10px; left: 10px; z-index: 20;
            background: var(--accent); color: #fff;
            font-family: 'Montserrat', sans-serif; font-weight: 700;
            font-size: .72rem; letter-spacing: .04em;
            padding: 4px 10px; border-radius: 20px;
        }
        .badge-pct {
            position: absolute; top: 10px; right: 10px; z-index: 20;
            background: var(--blue); color: #fff;
            font-family: 'Montserrat', sans-serif; font-weight: 700;
            font-size: .7rem;
            padding: 3px 8px; border-radius: 20px;
        }

        /* Wishlist quick-action */
        .card-actions {
            position: absolute; top: 10px; right: 10px; z-index: 20;
            display: flex; flex-direction: column; gap: 6px;
            opacity: 0; transform: translateX(8px);
            transition: opacity .25s, transform .25s;
        }
        .product-card:hover .card-actions { opacity: 1; transform: translateX(0); }
        /* hide pct badge when actions show */
        .product-card:hover .badge-pct { opacity: 0; }

        .quick-btn {
            width: 32px; height: 32px; border-radius: 50%;
            background: var(--white); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: .82rem; color: var(--muted);
            transition: all .15s; box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }
        .quick-btn:hover { background: var(--blue); color: #fff; border-color: var(--blue); }

        /* Card body */
        .card-body { padding: 14px; }
        .card-cat { font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); margin-bottom: 4px; }
        .card-name { font-family: 'Montserrat', sans-serif; font-size: .9rem; font-weight: 600; color: var(--text); margin-bottom: 10px; line-height: 1.35; min-height: 38px; }
        .card-prices { margin-bottom: 12px; }
        .price-orig { font-size: .78rem; color: var(--muted); text-decoration: line-through; display: block; }
        .price-now { font-size: 1.05rem; font-weight: 700; color: var(--blue); }
        .add-btn {
            width: 100%; padding: 9px; border: none; border-radius: 8px;
            background: #eff6ff; color: var(--blue); font-family: 'Montserrat', sans-serif;
            font-size: .8rem; font-weight: 700; letter-spacing: .05em;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;
            transition: background .2s, color .2s;
        }
        .add-btn:hover { background: var(--blue); color: #fff; }

        /* LIST VIEW */
        .list-view .product-card { display: grid; grid-template-columns: 180px 1fr; }
        .list-view .card-img-wrap { aspect-ratio: auto; height: 160px; }
        .list-view .card-body { padding: 18px; display: flex; flex-direction: column; justify-content: space-between; }
        .list-view .add-btn { max-width: 180px; }

        /* ── EMPTY STATE ── */
        .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
        .empty-state i { font-size: 3rem; color: var(--border); margin-bottom: 16px; }
        .empty-state p { font-size: 1rem; }

        /* ── TOAST ── */
        .toast {
            position: fixed; bottom: 24px; right: 24px; z-index: 999;
            background: var(--text); color: #fff;
            padding: 12px 20px; border-radius: 10px;
            font-size: .88rem; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,.2);
            transform: translateY(80px); opacity: 0;
            transition: all .35s cubic-bezier(.34,1.56,.64,1);
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast i { color: #4ade80; font-size: 1rem; }

        /* ── PAGINATION ── */
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 32px; }
        .page-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); background: var(--white); cursor: pointer; font-size: .88rem; font-family: 'Montserrat', sans-serif; font-weight: 600; transition: all .15s; }
        .page-btn:hover, .page-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
        .page-btn.ellipsis { border: none; background: none; cursor: default; }

        /* ── RESPONSIVE ── */
        @media (max-width: 900px) {
            .shop-layout { grid-template-columns: 1fr; }
            .filters { position: static; display: none; }
            .filters.open { display: block; }
        }
        @media (max-width: 600px) {
            .header .wrap { gap: 10px; }
            .header-icons { display: none; }
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }
    </style>
</head>

      images:['https://images.unsplash.com/photo-1597852074816-d933c7d2b988?w=600&h=600&fit=crop','https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=600&h=600&fit=crop'] },
    { id:12, name:'Placa de Vídeo RTX 4060',    category:'componentes', price:320000, origPrice:null, discount:null, onSale:false,
      images:['https://images.unsplash.com/photo-1591488320449-011701bb6704?w=600&h=600&fit=crop','https://images.unsplash.com/photo-1555680202-c86f0e12f086?w=600&h=600&fit=crop'] },
    { id:13, name:'Fonte 750W Modular',         category:'componentes', price:78000, origPrice:null,  discount:null, onSale:false,
      images:['https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=600&h=600&fit=crop','https://images.unsplash.com/photo-1518770660439-4636190af475?w=600&h=600&fit=crop'] },
    { id:14, name:'Mousepad XL Gaming',         category:'perifericos', price:18000, origPrice:null,  discount:null, onSale:false,
      images:['https://images.unsplash.com/photo-1600861194802-a2b11076bc51?w=600&h=600&fit=crop','https://images.unsplash.com/photo-1511467687858-23d96c32e4ae?w=600&h=600&fit=crop'] },
    { id:15, name:'Hub USB-C 7 em 1',           category:'perifericos', price:32000, origPrice:null,  discount:null, onSale:false,
      images:['https://images.unsplash.com/photo-1625842268584-8f3296236761?w=600&h=600&fit=crop','https://images.unsplash.com/photo-1558618047-3c8c76ca7d13?w=600&h=600&fit=crop'] },
    { id:16, name:'Monitor 24" Full HD',        category:'monitores',   price:240000, origPrice:null, discount:null, onSale:false,
      images:['https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=600&h=600&fit=crop','https://images.unsplash.com/photo-1593642634402-b0eb5e2eebc9?w=600&h=600&fit=crop'] },
];

// ── STATE ──
let cart = JSON.parse(localStorage.getItem('bt_cart') || '[]');
let activeCategory = 'all';
let maxPrice = 320000;
let sortBy = 'relevance';
let onlyOffers = false;
let searchQuery = '';
let listView = false;
let wishlist = new Set();

// ── FORMAT ──
function fmt(n) { return n.toLocaleString('pt-PT') + ' Kz'; }

// ── CART ──
function updateCartBadge() {
    const total = cart.reduce((s, i) => s + i.qty, 0);
    document.getElementById('cartCount').textContent = total;
}
function addToCart(id) {
    const p = products.find(x => x.id === id);
    const existing = cart.find(x => x.id === id);
    if (existing) existing.qty++;
    else cart.push({ id, name: p.name, price: p.price, qty: 1 });
    localStorage.setItem('bt_cart', JSON.stringify(cart));
    updateCartBadge();
    showToast(`"${p.name}" adicionado ao carrinho!`);
}

// ── TOAST ──
let toastTimer;
function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ── FILTER & SORT ──
function getFiltered() {
    let list = products.filter(p => {
        if (activeCategory !== 'all' && p.category !== activeCategory) return false;
        if (p.price > maxPrice) return false;
        if (onlyOffers && !p.onSale) return false;
        if (searchQuery && !p.name.toLowerCase().includes(searchQuery)) return false;
        return true;
    });
    if (sortBy === 'price-asc')  list.sort((a,b) => a.price - b.price);
    if (sortBy === 'price-desc') list.sort((a,b) => b.price - a.price);
    if (sortBy === 'name')       list.sort((a,b) => a.name.localeCompare(b.name));
    if (sortBy === 'discount')   list.sort((a,b) => (b.discount||0) - (a.discount||0));
    return list;
}

// ── RENDER ──
function renderCards() {
    const list = getFiltered();
    const grid = document.getElementById('productsGrid');
    const empty = document.getElementById('emptyState');
    document.getElementById('countNum').textContent = list.length;

    grid.className = 'products-grid' + (listView ? ' list-view' : '');

    if (list.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';

    grid.innerHTML = list.map(p => {
        const wl = wishlist.has(p.id);
        return `
        <div class="product-card" data-id="${p.id}">
            <div class="card-img-wrap">
                <img class="card-img-main" src="${p.images[0]}" alt="${p.name}" loading="lazy">
                <img class="card-img-alt"  src="${p.images[1]}" alt="${p.name} — vista 2" loading="lazy">
                <div class="img-dots">
                    <div class="img-dot active"></div>
                    <div class="img-dot"></div>
                </div>
                ${p.onSale ? `<div class="badge-sale">Oferta!</div>` : ''}
                ${p.discount ? `<div class="badge-pct">-${p.discount}%</div>` : ''}
                <div class="card-actions">
                    <button class="quick-btn" title="Favorito" onclick="toggleWishlist(event,${p.id})">
                        <i class="${wl ? 'fas' : 'far'} fa-heart" style="${wl ? 'color:var(--accent)' : ''}"></i>
                    </button>
                    <button class="quick-btn" title="Visualização rápida" onclick="quickView(event,${p.id})">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="card-body">
                <p class="card-cat">${p.category}</p>
                <h3 class="card-name">${p.name}</h3>
                <div class="card-prices">
                    ${p.origPrice ? `<span class="price-orig">${fmt(p.origPrice)}</span>` : ''}
                    <span class="price-now">${fmt(p.price)}</span>
                </div>
                <button class="add-btn" onclick="addToCart(${p.id})">
                    <i class="fas fa-cart-plus"></i> ADICIONAR
                </button>
            </div>
        </div>`;
    }).join('');
}

// ── WISHLIST ──
function toggleWishlist(e, id) {
    e.stopPropagation();
    if (wishlist.has(id)) wishlist.delete(id);
    else { wishlist.add(id); showToast('Adicionado aos favoritos!'); }
    renderCards();
}

// ── QUICK VIEW (simple modal) ──
function quickView(e, id) {
    e.stopPropagation();
    const p = products.find(x => x.id === id);
    showToast(`"${p.name}" — ${fmt(p.price)}`);
}

// ── SEARCH ──
function applySearch() {
    searchQuery = document.getElementById('headerSearch').value.trim().toLowerCase();
    renderCards();
}
document.getElementById('headerSearch').addEventListener('keydown', e => {
    if (e.key === 'Enter') applySearch();
});

// ── FILTERS WIRING ──
document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.dataset.cat;
        renderCards();
    });
});

const slider = document.getElementById('priceSlider');
slider.addEventListener('input', () => {
    maxPrice = +slider.value;
    document.getElementById('priceLabel').textContent = maxPrice.toLocaleString('pt-PT') + ' Kz';
    renderCards();
});

document.getElementById('sortSelect').addEventListener('change', e => {
    sortBy = e.target.value;
    renderCards();
});

document.getElementById('onlyOffers').addEventListener('change', e => {
    onlyOffers = e.target.checked;
    renderCards();
});

document.getElementById('clearFilters').addEventListener('click', () => {
    activeCategory = 'all';
    maxPrice = 320000;
    sortBy = 'relevance';
    onlyOffers = false;
    searchQuery = '';
    slider.value = 320000;
    document.getElementById('priceLabel').textContent = '320 000 Kz';
    document.getElementById('sortSelect').value = 'relevance';
    document.getElementById('onlyOffers').checked = false;
    document.getElementById('headerSearch').value = '';
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === 'all'));
    renderCards();
});

// ── VIEW TOGGLE ──
document.getElementById('gridViewBtn').addEventListener('click', () => {
    listView = false;
    document.getElementById('gridViewBtn').classList.add('active');
    document.getElementById('listViewBtn').classList.remove('active');
    renderCards();
});
document.getElementById('listViewBtn').addEventListener('click', () => {
    listView = true;
    document.getElementById('listViewBtn').classList.add('active');
    document.getElementById('gridViewBtn').classList.remove('active');
    renderCards();
});

// ── INIT ──
updateCartBadge();
renderCards();
</script>

<!-- PAGE TRANSITION -->
<script src="../page-transition.js"></script>
